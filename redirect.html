<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=https://luisjhz89-svg.github.io/binance-skills-hub/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills Hub Pro</title>
    <style>
      :root {
        --bg: #07111d;
        --panel: rgba(15, 22, 34, 0.8);
        --border: rgba(255,255,255,0.08);
        --text: #edf3ff;
        --muted: #c7d7ff;
        --accent: #5d7cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top left, rgba(93, 124, 255, 0.25), transparent 30%), #07111d;
        color: var(--text);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }
      .card {
        width: min(90vw, 520px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 28px 24px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.22);
        text-align: center;
      }
      .tag {
        display: inline-block;
        margin-bottom: 12px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(93,124,255,0.12);
        border: 1px solid rgba(93,124,255,0.35);
        color: #dfe9ff;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 14px;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        letter-spacing: -0.05em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      a {
        color: #dfe9ff;
        text-decoration: none;
      }
      .btn {
        display: inline-block;
        margin-top: 22px;
        padding: 12px 18px;
        border-radius: 12px;
        background: linear-gradient(135deg, #7c7cff, #4d6bff);
        color: white;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tag">Redirecting</div>
      <h1>Skills Hub Pro</h1>
      <p>Estás siendo redirigido a la versión pública correcta de la landing.</p>
      <a class="btn" href="https://luisjhz89-svg.github.io/binance-skills-hub/">Ir ahora</a>
    </div>
  </body>
</html>
